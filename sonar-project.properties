sonar.projectKey=MarMarLwin_30-seconds-of-java-master
sonar.organization=marmarlwin


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=chat
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# Only analyze app code and tests; android/, ios/, web/, pipeline/ and build/ are skipped.
sonar.sources=src
sonar.tests=test

# Skip generated code (riverpod/json_serializable/freezed)
sonar.exclusions=**/*.g.dart,**/*.freezed.dart
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,lib/main.dart

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
