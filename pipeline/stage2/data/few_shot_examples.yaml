java:S2093:
  - title: Replace try/finally closing with try-with-resources
    before: |
      static void saveNotes(Path file, String text) throws IOException {
        Writer writer = Files.newBufferedWriter(file);
        try {
          writer.write(text);
        } finally {
          writer.close();
        }
      }
    after: |
      static void saveNotes(Path file, String text) throws IOException {
        try (Writer writer = Files.newBufferedWriter(file)) {
          writer.write(text);
        }
      }
