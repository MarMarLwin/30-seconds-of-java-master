java:S9342:
  - title: Write the content of an archive entry before closing it
    before: |
      static void addReport(ZipOutputStream zip, String name, byte[] data) throws IOException {
        zip.putNextEntry(new ZipEntry(name));
        zip.closeEntry();
      }
    after: |
      static void addReport(ZipOutputStream zip, String name, byte[] data) throws IOException {
        zip.putNextEntry(new ZipEntry(name));
        zip.write(data);
        zip.closeEntry();
      }

